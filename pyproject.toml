[build-system]
requires = ["wheel", "setuptools>=68", "setuptools-golang", "cffi>=1.15.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytrivydb"
version = "0.1.0.dev0"
description = "Python reader for Aqua's trivy-db BoltDB vulnerability database"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "John Anderson", email = "sontek@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "cffi>=1.15.0,<2",
    "pydantic>=2,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/drape-io/pytrivydb"
Repository = "https://github.com/drape-io/pytrivydb"
Issues = "https://github.com/drape-io/pytrivydb/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ty>=0.0.1",
    "ruff>=0.6",
]

[tool.setuptools]
# Explicit single-package list — `find` with `exclude = ["pytrivydb.tests*"]`
# does NOT actually drop the test directory contents from the built wheel
# (verified empirically). An explicit package list keeps tests out.
packages = ["pytrivydb"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "pytrivydb/_pytrivydb_cffi.py",  # auto-generated by CFFI
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = [
    "PLR0913",  # too many arguments — find_advisories has 4 kwargs by design
    "PLR2004",  # magic value comparisons in tests
]

[tool.ruff.lint.per-file-ignores]
"pytrivydb/tests/**/*.py" = ["PLR2004", "S101"]

[tool.ty.src]
include = ["pytrivydb"]
exclude = ["pytrivydb/tests", "pytrivydb/_pytrivydb_cffi*"]

[tool.pytest.ini_options]
testpaths = ["pytrivydb/tests"]
addopts = "-ra"
